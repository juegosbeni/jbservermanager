name: Test BAT

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Crear BAT
        shell: powershell
        run: |
          @'
          @echo off

          python --version >nul 2>&1
          IF %ERRORLEVEL% NEQ 0 (
              echo Python no encontrado. Instalando Python 3.12...

              powershell -Command "Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.12.0/python-3.12.0-amd64.exe -OutFile python_installer.exe"

              start /wait python_installer.exe /quiet InstallAllUsers=1 PrependPath=1

              del python_installer.exe
          ) ELSE (
              echo Python ya esta instalado.
          )

          powershell -Command "Invoke-WebRequest -Uri https://github.com/juegosbeni/jbservermanager/releases/download/Pre-Alpha/main.py -OutFile main.py"

          python main.py
          '@ | Out-File start.bat -Encoding ascii

      - name: Ejecutar BAT
        shell: cmd
        run: start.bat
